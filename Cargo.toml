[package]
name = "tabia-shogi-server"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
# `all` is what exposes `TCP_QUICKACK`: std has no accessor for it, and socket2
# gates every platform-specific option behind that one feature.
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
# `ring` rather than the default `aws_lc_rs` provider: aws-lc-sys builds C with
# cmake, which the container image would then have to carry. rustls is chosen
# precisely so that no C TLS stack comes with it.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The test certificate is generated per run rather than checked in, so there is
# no file that can expire. `ring` for the same reason as `tokio-rustls` above.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
# `test-util` is a dev-dependency only: it is what `#[tokio::test(start_paused =
# true)]` needs to drive the deadline's clock deterministically, and it must not
# reach the built server, where a pausable clock would be a way for time to stop.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
