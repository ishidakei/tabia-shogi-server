name: Feature request
description: Something the server should be able to do and cannot.
title: "feature: "
body:
  - type: textarea
    id: capability
    attributes:
      label: What should the server be able to do?
      description: Describe it as something an engine developer or an operator can observe.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why does it matter?
      description: What are you trying to do that the server does not let you do today?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do instead today
      description: The workaround, if you have one, and what it costs you.
    validations:
      required: false
