# The Denryu-sen main event's clock, written with this server's own keys:
# sente 3 minutes and gote 10 minutes, a 2-second increment for both, each
# move's thinking time truncated to whole seconds with no minimum charge, and a
# draw once move 512 is reached undecided.
#
# Both allowances start at 600 seconds, and sente's is reduced to 180 through
# the setup-move T-value, which is how an asymmetric clock reaches a client.
auth_mode = "open"
positions = "assets/positions/interop.txt"
records = "records"
database = "tabia.sqlite3"

[limit]
max_moves = 512
min_playable_plies = 40

[matchmaking]
idle_delay_seconds = 0
interval_seconds = 1

[csa]
host = "0.0.0.0"
port = 4081
max_malformed_lines = 8
agreement_timeout_seconds = 120

[time]
time_unit = "1sec"
total = 600
increment = 2
least_time_per_move = 0
roundup = false
reduction = { side = "black", amount = 420 }
