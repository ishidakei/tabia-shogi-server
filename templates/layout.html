<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tabia-shogi-server{% endblock %}</title>
<style>
/* Embedded rather than served from /static, so a deployment that copies the
   binary and not the tree still has it. */
:root { color-scheme: light dark; }
body {
  font-family: system-ui, sans-serif;
  line-height: 1.6;
  margin: 0 auto;
  max-width: 60rem;
  padding: 1rem;
}
h1 { font-size: 1.4rem; margin-bottom: 0; }
nav { font-size: 0.9rem; margin-bottom: 1rem; }
h2 { font-size: 1.1rem; margin-top: 2rem; }
a { color: inherit; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid currentColor; padding: 0.2rem 0.5rem; text-align: left; }
th { font-weight: 600; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; }
dt { font-weight: 600; }
dd { margin: 0; }
.board { font-family: ui-monospace, monospace; table-layout: fixed; width: auto; }
.board td { height: 2rem; padding: 0.1rem; text-align: center; width: 2.4rem; }
.board td.white { transform: rotate(180deg); }
.board td.empty { color: transparent; }
.hand { font-family: ui-monospace, monospace; }
.muted { opacity: 0.7; }
</style>
</head>
<body>
<h1><a href="/">tabia-shogi-server</a></h1>
<nav class="muted"><a href="/">対局一覧</a> · <a href="/participants">参加者一覧</a> · <a href="/ratings">レーティング</a></nav>
{% block content %}{% endblock %}
</body>
</html>
